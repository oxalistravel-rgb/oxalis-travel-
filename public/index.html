<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oxalis Travel — Gestion de l'agence</title>
<style>
  :root{ --marine:#0e2a47; --or:#c8a24a; --creme:#f7f3ea; --rouge:#c0392b; --bord:#e2dcce; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,Tahoma,sans-serif;background:var(--creme);color:#1c2b3a}
  header{background:var(--marine);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;letter-spacing:.14em;text-transform:uppercase}
  nav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  nav button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 14px;border-radius:4px;cursor:pointer;font-size:13px}
  nav button.actif{background:var(--or);border-color:var(--or);color:#12243a;font-weight:600}
  main{padding:24px;max-width:1200px;margin:0 auto}
  h2{font-size:20px;color:var(--marine);margin:0 0 16px}
  .cartes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px}
  .carte{background:#fff;border:1px solid var(--bord);border-radius:6px;padding:16px}
  .carte span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#7a8794}
  .carte strong{display:block;font-size:22px;margin-top:6px;color:var(--marine)}
  form{background:#fff;border:1px solid var(--bord);border-radius:6px;padding:16px;margin-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  label{font-size:12px;color:#5b6873;display:block;margin-bottom:4px}
  input,select,textarea{width:100%;padding:9px;border:1px solid var(--bord);border-radius:4px;font-size:14px;font-family:inherit}
  .actions{grid-column:1/-1;display:flex;gap:10px}
  button.principal{background:var(--rouge);color:#fff;border:0;padding:10px 20px;border-radius:4px;cursor:pointer;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  button.secondaire{background:#fff;border:1px solid var(--bord);padding:10px 18px;border-radius:4px;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bord);border-radius:6px;overflow:hidden;font-size:14px}
  th{background:var(--marine);color:#fff;text-align:left;padding:10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  td{padding:10px;border-top:1px solid var(--bord)}
  tr:hover td{background:#fbf8f1}
  .sup{color:var(--rouge);cursor:pointer;background:none;border:0;font-size:13px}
  .vide{padding:22px;text-align:center;color:#8b96a1;background:#fff;border:1px dashed var(--bord);border-radius:6px}
  .msg{padding:10px 14px;border-radius:4px;margin-bottom:14px;display:none;font-size:14px}
  .msg.ok{background:#e6f4ea;color:#1e6b3a;display:block}
  .msg.ko{background:#fdecea;color:#992013;display:block}
  .panneau{display:none}.panneau.actif{display:block}
</style>
</head>
<body>
<header>
  <h1>Oxalis Travel — Gestion</h1>
  <nav>
    <button data-p="bord" class="actif">Tableau de bord</button>
    <button data-p="clients">Clients</button>
    <button data-p="reservations">Dossiers</button>
    <button data-p="paiements">Paiements</button>
    <button data-p="depenses">Dépenses</button>
  </nav>
</header>
<main>
  <div id="msg" class="msg"></div>

  <section id="p-bord" class="panneau actif">
    <h2>Tableau de bord</h2>
    <div class="cartes" id="stats"></div>
  </section>

  <section id="p-clients" class="panneau">
    <h2>Clients</h2>
    <form id="f-client">
      <div><label>Nom *</label><input name="nom" required></div>
      <div><label>Prénom *</label><input name="prenom" required></div>
      <div><label>Téléphone</label><input name="telephone"></div>
      <div><label>Email</label><input name="email" type="email"></div>
      <div><label>N° passeport</label><input name="passeport_numero"></div>
      <div><label>Expiration passeport</label><input name="passeport_expiration" type="date"></div>
      <div><label>Adresse</label><input name="adresse"></div>
      <div class="actions"><button class="principal" type="submit">Ajouter le client</button></div>
    </form>
    <div id="t-clients"></div>
  </section>

  <section id="p-reservations" class="panneau">
    <h2>Dossiers de voyage</h2>
    <form id="f-reservation">
      <div><label>Client *</label><select name="client_id" id="sel-client" required></select></div>
      <div><label>Destination</label><input name="destination"></div>
      <div><label>Date départ</label><input name="date_depart" type="date"></div>
      <div><label>Date retour</label><input name="date_retour" type="date"></div>
      <div><label>Personnes</label><input name="nombre_personnes" type="number" min="1" value="1"></div>
      <div><label>Prix total (DA)</label><input name="prix_total" type="number" min="0" step="100" value="0"></div>
      <div><label>Statut</label><select name="statut">
        <option value="en_attente">En attente</option><option value="confirmee">Confirmée</option>
        <option value="payee">Payée</option><option value="terminee">Terminée</option><option value="annulee">Annulée</option>
      </select></div>
      <div class="actions"><button class="principal" type="submit">Créer le dossier</button></div>
    </form>
    <div id="t-reservations"></div>
  </section>

  <section id="p-paiements" class="panneau">
    <h2>Paiements</h2>
    <form id="f-paiement">
      <div><label>Dossier *</label><select name="reservation_id" id="sel-dossier" required></select></div>
      <div><label>Montant (DA) *</label><input name="montant" type="number" min="1" step="100" required></div>
      <div><label>Mode</label><select name="methode">
        <option value="especes">Espèces</option><option value="virement">Virement</option>
        <option value="cheque">Chèque</option><option value="carte">Carte</option><option value="autre">Autre</option>
      </select></div>
      <div><label>Date</label><input name="date_paiement" type="date"></div>
      <div><label>Référence</label><input name="reference"></div>
      <div class="actions"><button class="principal" type="submit">Enregistrer le paiement</button></div>
    </form>
    <div id="t-paiements"></div>
  </section>

  <section id="p-depenses" class="panneau">
    <h2>Dépenses</h2>
    <form id="f-depense">
      <div><label>Libellé *</label><input name="libelle" required></div>
      <div><label>Catégorie</label><input name="categorie"></div>
      <div><label>Montant (DA) *</label><input name="montant" type="number" min="1" step="100" required></div>
      <div><label>Date</label><input name="date_depense" type="date"></div>
      <div class="actions"><button class="principal" type="submit">Ajouter la dépense</button></div>
    </form>
    <div id="t-depenses"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const msg = $('#msg');
function afficherMsg(texte, ok = true) {
  msg.textContent = texte;
  msg.className = 'msg ' + (ok ? 'ok' : 'ko');
  setTimeout(() => { msg.className = 'msg'; }, 4000);
}
async function api(url, options) {
  const r = await fetch('/api' + url, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.erreur || data.detail || 'Erreur');
  return data;
}
const esc = (str) => {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
};
const argent = (n) => esc(Number(n || 0).toLocaleString('fr-FR') + ' DA');
const jour = (d) => esc(d ? new Date(d).toLocaleDateString('fr-FR') : '—');

document.querySelectorAll('nav button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach((x) => x.classList.remove('actif'));
    document.querySelectorAll('.panneau').forEach((x) => x.classList.remove('actif'));
    b.classList.add('actif');
    $('#p-' + b.dataset.p).classList.add('actif');
    tout();
  };
});

function tableau(cible, colonnes, lignes, suppr) {
  const el = $(cible);
  if (!lignes.length) { el.innerHTML = '<div class="vide">Aucun enregistrement pour le moment.</div>'; return; }
  el.innerHTML = '<table><thead><tr>' + colonnes.map((c) => '<th>' + c.t + '</th>').join('') +
    '<th></th></tr></thead><tbody>' +
    lignes.map((l) => '<tr>' + colonnes.map((c) => '<td>' + c.v(l) + '</td>').join('') +
      '<td><button class="sup" data-id="' + l.id + '">Supprimer</button></td></tr>').join('') +
    '</tbody></table>';
  el.querySelectorAll('.sup').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Confirmer la suppression ?')) return;
      try { await api(suppr + b.dataset.id, { method: 'DELETE' }); afficherMsg('Supprimé.'); tout(); }
      catch (e) { afficherMsg(e.message, false); }
    };
  });
}

async function chargerStats() {
  const s = await api('/stats');
  $('#stats').innerHTML = [
    ['Clients', s.clients], ['Dossiers', s.reservations],
    ["Chiffre d'affaires", argent(s.chiffre_affaires)], ['Encaissé', argent(s.encaisse)],
    ['Reste à encaisser', argent(s.reste_a_encaisser)], ['Dépenses', argent(s.depenses)],
    ['Caisse', argent(s.caisse)],
  ].map(([t, v]) => '<div class="carte"><span>' + t + '</span><strong>' + v + '</strong></div>').join('');
}

async function chargerClients() {
  const c = await api('/clients');
  tableau('#t-clients', [
    { t: 'Nom', v: (x) => esc(x.nom) + ' ' + esc(x.prenom) },
    { t: 'Téléphone', v: (x) => esc(x.telephone) || '—' },
    { t: 'Email', v: (x) => esc(x.email) || '—' },
    { t: 'Passeport', v: (x) => esc(x.passeport_numero) || '—' },
  ], c, '/clients/');
  $('#sel-client').innerHTML = c.map((x) => '<option value="' + x.id + '">' + esc(x.nom) + ' ' + esc(x.prenom) + '</option>').join('');
}

async function chargerReservations() {
  const r = await api('/reservations');
  tableau('#t-reservations', [
    { t: 'Client', v: (x) => esc(x.nom) + ' ' + esc(x.prenom) },
    { t: 'Destination', v: (x) => esc(x.destination) || '—' },
    { t: 'Départ', v: (x) => jour(x.date_depart) },
    { t: 'Pers.', v: (x) => esc(x.nombre_personnes) },
    { t: 'Prix', v: (x) => argent(x.prix_total) },
    { t: 'Payé', v: (x) => argent(x.total_paye) },
    { t: 'Reste', v: (x) => argent(x.reste) },
    { t: 'Statut', v: (x) => esc(x.statut) },
  ], r, '/reservations/');
  $('#sel-dossier').innerHTML = r.map((x) =>
    '<option value="' + x.id + '">' + esc(x.nom) + ' ' + esc(x.prenom) + ' — ' + esc(x.destination || 'dossier') + ' (reste ' + argent(x.reste) + ')</option>').join('');
}

async function chargerPaiements() {
  const p = await api('/paiements');
  tableau('#t-paiements', [
    { t: 'Client', v: (x) => esc(x.nom) + ' ' + esc(x.prenom) },
    { t: 'Montant', v: (x) => argent(x.montant) },
    { t: 'Mode', v: (x) => esc(x.methode) },
    { t: 'Date', v: (x) => jour(x.date_paiement) },
    { t: 'Référence', v: (x) => esc(x.reference) || '—' },
  ], p, '/paiements/');
}

async function chargerDepenses() {
  const d = await api('/depenses');
  tableau('#t-depenses', [
    { t: 'Libellé', v: (x) => esc(x.libelle) },
    { t: 'Catégorie', v: (x) => esc(x.categorie) || '—' },
    { t: 'Montant', v: (x) => argent(x.montant) },
    { t: 'Date', v: (x) => jour(x.date_depense) },
  ], d, '/depenses/');
}

function brancher(formulaire, url, apres) {
  $(formulaire).onsubmit = async (e) => {
    e.preventDefault();
    const corps = Object.fromEntries(new FormData(e.target).entries());
    Object.keys(corps).forEach((k) => { if (corps[k] === '') corps[k] = null; });
    try {
      await api(url, { method: 'POST', body: JSON.stringify(corps) });
      e.target.reset();
      afficherMsg('Enregistré avec succès.');
      tout();
    } catch (err) { afficherMsg(err.message, false); }
  };
}
brancher('#f-client', '/clients');
brancher('#f-reservation', '/reservations');
brancher('#f-paiement', '/paiements');
brancher('#f-depense', '/depenses');

async function tout() {
  try {
    await Promise.all([chargerStats(), chargerClients(), chargerReservations(), chargerPaiements(), chargerDepenses()]);
  } catch (e) { afficherMsg('Base non disponible : ' + e.message, false); }
}
tout();
</script>
</body>
</html>
